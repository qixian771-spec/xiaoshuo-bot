# nginx site for the Korea server (kr): baogongtou.vip -> xiaoshuo-bot serve on 127.0.0.1:8080.
# Installed as /etc/nginx/sites-enabled/baogongtou.vip. Port 443 belongs to trojan; do not bind it here.
# /vmws is the existing VPN websocket route and must stay untouched.

server {
    listen 80;
    server_name baogongtou.vip www.baogongtou.vip 43.131.254.239;

    location /vmws {
        proxy_pass http://127.0.0.1:10000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # Server-Sent Events (public studio feed + admin live stream): no buffering, long reads.
    location ~ ^/api/(public/)?events/stream$ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Wizard confirm runs a full-book planning call; allow it to finish.
        proxy_read_timeout 600s;
        client_max_body_size 2m;
    }
}
