style:
  genre_id: "urban_brainhole"
  allow_pov_inner_monologue: true
  humor: true
  narration_rules: "坚持一卷一行业副本与日常小案加通缉重案双轨节奏，每卷必须落到具体器物工艺细节、物理取证与法律程序闭环；六大配角严禁沦为捧哏工具人，必须在各自专业领域拥有独立行动、试错低谷与阶段高光。"
  sample_text: |
    沧江老码头的梅雨刚歇，程远舟把修补台上的黄铜放大镜推到灯下，指腹轻轻刮过那面号称清代传家宝的菱花铜镜边缘。
    站在柜台外的大金链子男人抱起胳膊冷笑：“小子，别装模作样了，这镜子你要么五万块收下赔罪，要么今天把铺子钥匙交出来。”
    程远舟头也没抬，用小镊子顺着镜背云纹轻轻一挑，一截泛着机油亮的现代车床毛刺当场弹在白瓷盘里：“胡老板，清代工匠要是用得上数控铣床，你后腰手包里那张上周五的假货提货单，是不是也能算百年文物？”
    镜头后面，姜可欣顺手把手机焦距拉满，直播间在线人数瞬间跳过了两万。

adaptation:
  visual_hook: "老码头青石板雨夜暖黄台灯下，青年指尖轻触古旧铜器刹那，铜面水波般映出涉案暗债的时间刻度与器物残影"
  protagonist_look: "二十六岁清瘦青年，深灰帆布修补围裙配立领旧工装，右掌虎口带细微烫茧，眼神冷静笃定"
