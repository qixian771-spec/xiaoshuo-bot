premise:
  logline: "沧江老码头古玩街的旧物修复师程远舟，掌心觉醒能映照涉案器物暗债的听铜瞳，从街头日常鉴物破局起步，把一间冷清旧铺打造成直播追凶、横跨三十座行业副本的暗夜公道直播间。"
  selling_points:
    - "一卷一行业副本：每卷切换全新场景与破案玩法，日常小案与通缉重案双轨并行不重复"
    - "六大常驻配角各自背负独立执念与翻车低谷，在三十卷里分阶段兑现个人成长线"
    - "古玩修复物理细节结合直播间实时核验，以物证闭环串联跨省黑产主线"
  selling_point_keywords:
    - "听铜"
    - "鉴物"
    - "直播"
    - "通缉"
    - "旧铺"
    - "翻案"
  benchmark_refs:
    - title: "直播算命：我把榜一大哥送进去了"
      why: "借用连麦破案与实时围观的强节奏爽感，并用行业物证与配角群像撑起千章长篇"
    - title: "都市奇门小相师"
      why: "吸收旧物器物修复质感与市井人情，同时以现实刑侦与法律程序兜住逻辑边界"
  target_readers: "喜欢都市脑洞、一卷一副本探案、直播打假与群像长线成长的番茄男频及悬疑读者"

target_total_chars: 2300000
chapter_chars_range:
  - 2100
  - 2500

protagonist:
  character_id: "mc"
  desire: "查清十年前沧江旧船厂失火与师父失踪的真相，替老码头受骗街坊追回被黑产吞掉的血汗钱"
  flaw: "表面按件计价斤斤计较，遇上旧识卷入重案时总想先一人扛下风险，直到吃亏才学会把后背交给团队"
  arc: "从只想守住老街旧物铺的修复学徒，成长为能统筹刑侦、法医、媒体与法援协作的三十卷破局核心"
  voice_card:
    speech_patterns: "说话自带修补匠的利落与冷幽默，先报修补工费再挑出器物上的反常刀痕，关键证据留到对手撒完谎再亮底牌"
    catchphrases:
      - "器物不会撒谎，撒谎的是经手人的指纹和账本。"

golden_finger:
  rules: "程远舟右掌心触碰含铜器物或通过高清连麦观察其金属包浆时，能感知器物上残留的最重一笔恶意交易时间、方位与关联物剪影；能力不直接吐露真凶姓名，必须靠修复取样、连麦盘问或刑侦核证形成闭环。"
  cost: "每次强行溯源涉及命案或跨省重案的器物，右掌都会起水泡脱皮并引发四小时指尖失灵；若单日超频三次，将连续两天无法精细执刀修补。"
  limits: "无法穿透全绝缘密封铅盒，无法对无主观恶意的意外损坏生效，严禁借能力参与赌石、彩票或二级市场投机。"
  upgrade_path:
    - volume: 1
      unlock: "近距掌纹听铜：触碰旧铜器即可感应七日内的藏匿方位与最后经手人情绪波动"
    - volume: 5
      unlock: "隔屏反光映影：高清直播间内识别金属反光中的异常印记与伪造焊点"
    - volume: 10
      unlock: "残片拼图溯源：将两件涉案器物残片并置时，可还原十年前同一作坊的出厂批次"
    - volume: 15
      unlock: "双物对账共鸣：同时检视账册铜扣与赃物时，能锁定经手中间人的资金分流方向"
    - volume: 20
      unlock: "舆情暗桩嗅觉：从伪造捐赠纪念章中辨别背后同一公关金主的批次暗记"
    - volume: 25
      unlock: "跨省链条图谱：聚合三枚以上暗网徽记即可显影黑产上下游的权力层级差"
    - volume: 30
      unlock: "终局暗债清零：完整拼合沧江旧船厂铜铭牌后，映出全部涉案原始封存档案坐标"

scale_rules:
  - ledger_key: "cash"
    policy: "bounded_realistic"
    hard_max: 8000000
    unit: "元"
  - ledger_key: "followers"
    policy: "bounded_realistic"
    hard_max: 20000000
    unit: "人"
  - ledger_key: "merit_aura"
    policy: "unbounded_fantasy"
    hard_max: null
    unit: "分"

