premise:
  logline: "江城南桥夜市摆摊算命的独眼青年许青川，左眼觉醒能称量人果善恶的因果秤瞳，从一桩拐卖与假玉器局起步，把算命摊支成全网直播追凶的暗夜正义档口。"
  selling_points:
    - "街头算卦一语破局，冷面巡捕从不信邪到暗中登门求卦的极致反差"
    - "真假玄学直播连麦当场打假，以物理证物闭环印证卦象"
    - "二十年前渡江沉案层层剥茧，市井小摊主撬动隐秘黑产保护伞"
  selling_point_keywords:
    - "算卦"
    - "因果秤"
    - "观气"
    - "夜市"
    - "直播"
    - "通缉"
  benchmark_refs:
    - title: "直播算命：我把榜一大哥送进去了"
      why: "借用连麦断事的强节奏与即时抓捕爽感，补强现实刑侦取证逻辑而非纯神棍口嗨"
    - title: "都市奇门小相师"
      why: "参考市井古玩与民俗器物细节质感，避免后期升级成脱离现实的仙侠玄幻"
  target_readers: "喜欢都市脑洞、直播断案、强逻辑打脸反转的番茄男频与泛悬疑读者"

target_total_chars: 900000
chapter_chars_range:
  - 2100
  - 2500

protagonist:
  character_id: "mc"
  desire: "还清当年师父留下的旧债、查明二十年前渡江沉案导致左眼失明的真相，并在南桥老街体面立住脚跟"
  flaw: "习惯用市井滑头和金钱交易掩饰重情重义，一旦牵扯亲近之人容易瞒着同伴独自扛雷"
  arc: "从只想靠摆摊糊口、收钱消灾的市井算命郎，蜕变为敢用真名在直播间直面黑产、把因果交由公道与法律裁决的破局者"
  voice_card:
    speech_patterns: "语速平缓带点市井痞气，喜欢先报卦金再点破对方死穴，关键证据只说半句留给对面自己慌"
    catchphrases:
      - "先扫码后听话，嫌贵出门左拐找桥洞老神仙。"

golden_finger:
  rules: "许青川左眼失明后觉醒因果秤瞳：注视对象三秒即可浮现其近期最重的一笔隐秘因果重量与关联物件轮廓，但只显象不直接吐露人名与法律定性，必须靠主角言语套问或物证核验才能锁定真凶。"
  cost: "每次强行称量背负重案或涉案金额极高的对象，左眼眶会剧烈灼痛并伴随长达六小时的右眼视物重影与低血糖冷汗；若一天内连续开瞳超过三次，将短暂失明二十四小时。"
  limits: "无法直接读取未接触对象十米外的画面，无法对无主观恶意的自然灾害生效，严禁靠虚空预测彩票或股价直接变现。"
  upgrade_path:
    - volume: 1
      unlock: "单人近距因果秤显影：可识别三米内对象七日内的隐匿恶意与关键随身物件"
    - volume: 2
      unlock: "隔屏微表情同步观气：高清直播连麦中若对方露出五官且光线充足，可捕捉其因果失衡方位"
    - volume: 4
      unlock: "旧物残留因果溯源：触碰超过二十年的涉案遗物时，可回放持物人最后一次情绪剧烈波动的环境剪影"
    - volume: 6
      unlock: "群像因果交织图谱：同场多名共犯之间存在资金或血案串联时，能分辨主谋与从犯的权重差"

scale_rules:
  - ledger_key: "cash"
    policy: "bounded_realistic"
    hard_max: 5000000
    unit: "元"
  - ledger_key: "followers"
    policy: "bounded_realistic"
    hard_max: 12000000
    unit: "人"
  - ledger_key: "merit_aura"
    policy: "unbounded_fantasy"
    hard_max: null
    unit: "分"

