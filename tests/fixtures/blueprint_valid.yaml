style:
  genre_id: "urban_brainhole"
  allow_pov_inner_monologue: true
  humor: true
  narration_rules: "第一要务是市井烟火气与快节奏对话推进，每一卦必须落到具体时间、物品、扫码金额或现场物证闭环；严禁大段堆砌玄学名词或修仙境界，配角反应靠手部动作与神态微变体现，不准写‘倒吸一口凉气’等套话。"
  sample_text: |
    南桥夜市刚亮起第一排白炽灯泡时，许青川把折叠小方桌支在烤冷面摊隔壁，桌上只摆了一块写着‘看事五十，不准倒赔一百’的旧松木牌。
    穿灰色工装裤的中年男人蹲在塑料凳上，手里攥着一张皱巴巴的医院缴费单，刚要开口问老人手术吉凶，许青川抬手按住桌角：“先别急着掏钱，你后腰裤兜里那张刚签了字的抵押协议，借条利息写的是月息三分还是五分？”
    中年男人的指节瞬间捏得发白，抬眼盯着镜片后面那只微微泛红的左眼：“你……你怎么知道我刚从典当行出来？”
    许青川往手机收款码上轻轻敲了两下：“先扫五十块摊位费，我顺便告诉你，那个催你抵押房子的人现在就在桥头面包车里，副驾脚垫底下还压着另外三户的假房产证。”

adaptation:
  visual_hook: "霓虹与白炽灯交错的市井夜市摊位前，青年摘下浅茶色平光镜的瞬间，左眼瞳孔倒映出一杆悬在当事人头顶倾斜的古铜小秤"
  protagonist_look: "二十五岁清瘦青年，利落短发，左眼浅茶色平光镜片后微带淡金细纹，深青帆布工装外套配旧木算盘珠手串"
