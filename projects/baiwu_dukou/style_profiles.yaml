style_profiles:
  - id: "craft_realism"
    name: "器物肌理与冷峻白描样本"
    granularity_notes: >
      以具象的名词和动词推进，聚焦金属氧化色、木器包浆、潮气水痕与手指操作细节；
      句幅短促扎实，绝不用感叹号与抒情副词，人物情绪全部折叠进摆放物件的角度与停顿里。
    sample_text: |
      台灯罩边缘掉了一块绿漆，白炽灯泡烤得铜灯座微微发烫。她戴上指套，用竹签挑开表壳内圈积着的一层黑油泥。油泥底下露出一道斜向划痕，边缘翻起极细的黄铜毛刺，是平口螺丝刀滑脱时留下的硬伤。窗外轮渡拉响一声低沉的汽笛，玻璃窗跟着震了半秒，震落了窗框槽里的一点干灰。她没抬头，把换下来的断发条夹进玻璃皿，镊子尖碰在皿壁上，发出一声清脆的短响。

  - id: "tense_dialogue"
    name: "冷调暗流对话样本"
    granularity_notes: >
      对话不打满，省略多余的‘愤怒地说/冷冷地道’等提示语，改用倒水、擦镜片、对齐纸张等伴随物理动作做节拍器；
      双方话语克制体面，锋芒藏在具体数字与物件归属里。
    sample_text: |
      “手续上已经销账了。”他把牛皮纸袋往桌心推了半寸，指尖离开纸面时留下一道浅潮印，“局里年底前要腾空西楼，留着也没地方搁。”
      她低头看着纸袋封口处断裂的棉线，用左手拇指轻轻刮过食指侧面的白疤。“销账单上签的是谁的字？”
      他摘下眼镜，捏起衣角擦了擦右镜片，没接这句，只指了指墙上的挂钟：“五点半渡口停航，你赶早班船回去还能赶上闭馆。”
      “我不坐船。”她把纸袋折好塞进风衣内袋，拉平袋口，“我走老桥。”

  - id: "nocturnal_suspense"
    name: "潮湿封闭空间夜行样本"
    granularity_notes: >
      利用手电光束切面、涉水声、铁器锈味与呼吸节律制造紧迫感，严格锁定视点人物耳目所及的局部范围，
      绝不渲染‘令人窒息的恐惧’，只写水深到鞋帮、铁柜卡死、脚步声停在第几级台阶。
    sample_text: |
      地下室积水刚没过橡胶鞋底，踩下去有一股混着机油和烂纸板的铁腥味。手电光柱斜切过成排的灰绿铁皮柜，柜门编号用红漆刷成，漆皮大多卷起了边。走廊尽头的配电箱突然咔哒跳了一下，顶灯灭了，只剩高处半扇气窗透进一点码头的橙黄钠灯光。水波纹映在水泥天花板上，晃动了一瞬又停住。隔着两排档案架，有什么硬物轻轻磕在铁皮水桶沿上，紧接着是胶鞋底擦过湿水泥地的沙沙声。
