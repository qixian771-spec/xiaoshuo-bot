characters:
  - id: "lin_wan"
    name: "林晚"
    role: "市博物馆金属与钟表器物修复师（31岁，林昼之妹，全书唯一限知视点人物）"
    personality: "冷静、克制、重实证，习惯从器物划痕、锈蚀与受力形变反推人的动作，极度排斥煽情与空泛安慰"
    speech_style: "句子短促平实，多用陈述句或直接指向具体器物细节的追问，不讲场面话"
    behavioral_anchors:
      愤怒或极度克制: "左手拇指反复摩挲食指侧面的旧刻刀白疤，或将手边的工具、纸张、茶杯拨成严格的平行线，绝不大喊大叫或摔东西"
      专注观察: "先屏住半拍呼吸看器物接缝与磨损面，指腹隔着棉布或轻触边缘，不急于下结论"
      防备与拒绝: "身体重心微向后移，双手插进风衣口袋按住证物，只给单字或短句回应"
    forbidden_ooc:
      - "严禁歇斯底里哭喊、质问苍天或长篇情绪宣泄"
      - "严禁在缺乏物理证据时凭直觉妄下结论"

  - id: "zhou_xu"
    name: "周叙"
    role: "旧港务局档案科科员（34岁，林昼生前同组调度员）"
    personality: "谨慎、负疚、长期处在体制边缘的隐忍压抑中，既害怕宏远航运报复又不忍林昼死因彻底湮灭"
    speech_style: "说话常在关键处停顿半拍，喜欢先说规章制度再暗递线索，声线偏低"
    behavioral_anchors:
      紧张或隐瞒: "摘下黑框眼镜用衣角反复擦拭镜片，右肩习惯性微塌，视线避开对方眼睛落在地面或桌面水渍上"
      焦虑戒备: "左手无名指上的旧烫伤疤痕会贴在公文包铜扣上反复按压，频繁回头看走廊或门外动静"
    forbidden_ooc:
      - "严禁表现得像热血莽撞的英雄或油滑世故的反派"

  - id: "chen_jingshan"
    name: "陈敬山"
    role: "老街‘敬山钟表铺’店主（64岁，林昼早年学艺的师父）"
    personality: "寡言、守旧、护短，对钟表齿轮有近乎执拗的洁癖，嘴硬心细"
    speech_style: "左耳略背但看口型极准，说话惜字如金，常用修表行话代替直白表态"
    behavioral_anchors:
      回避尖锐问题: "低头用铜镊拨弄煤油灯芯或摆弄擒纵轮，假装没听清，过几秒才冷不丁补一句关键实话"
      待客习惯: "用那只杯沿带缺口的骨瓷杯倒茶，永远只倒七分满，放杯时指节在桌面轻叩一下"
    forbidden_ooc:
      - "严禁喋喋不休讲大道理或主动煽情回忆往事"

  - id: "lu_min"
    name: "陆敏"
    role: "宏远航运集团法务部副总监（36岁）"
    personality: "体面、精明、滴水不漏，擅长用温和的合规辞令施压与收买"
    speech_style: "语速均匀礼貌，条理分明，常以‘出于人道关怀’、‘结清历史遗留手续’等温和措辞包裹威胁"
    behavioral_anchors:
      施压谈判: "黑色皮质公文夹永远平放在膝上或桌沿正中，交谈时从不触碰对方递来的热茶，钢笔帽每旋转半圈代表耐心收紧一分"
    forbidden_ooc:
      - "严禁像街头恶霸一样粗鄙叫嚣或当众失态"
