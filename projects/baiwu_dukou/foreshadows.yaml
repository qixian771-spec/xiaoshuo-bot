foreshadows:
  - id: "FS-01"
    title: "三号码头红铁丹防锈漆鞋印"
    plant_chapter: 1
    due_chapter: 3
    plant_instruction: >
      林晚进出敬山钟表铺门槛时，注意到门垫边缘蹭着半枚暗红色油性漆印，气味带桐油腥气，
      是新港三号码头船坞修补驳船吃水线专用的红铁丹防锈漆（暗示有人刚从三号码头过来提前翻找过钟表铺）。
    payoff_instruction: >
      第3章旧港务局地下档案室断电后，林晚在高处透气窗下方的水泥台面与积水边再次发现未干透的红铁丹防锈漆橡胶鞋印，
      与第1章钟表铺门口的漆印完全吻合，物理锁定潜入抢夺档案的人来自宏远航运控制的三号码头船坞。
    plant_keywords:
      - "红铁丹"
      - "防锈漆"
    payoff_keywords:
      - "红铁丹"
      - "防锈漆"
      - "三号码头"

  - id: "FS-02"
    title: "周叙左袖口内侧的蓝黑碳素墨渍与锯齿纸毛"
    plant_chapter: 1
    due_chapter: 4
    plant_instruction: >
      第1章周叙在钟表铺递交怀表信封、抬手擦眼镜时，林晚看见他深灰夹克左袖口内侧沾着一小道陈旧未洗净的蓝黑墨渍，
      呢料纤维间还挂着半根发黄的纸毛（当时林晚未点破，仅作器物修复师的视觉留痕）。
    payoff_instruction: >
      第4章在修复室体视显微镜下，林晚将怀表夹层油纸包着的半张残页与调度日志第19页书脊锯齿状纸茬严丝合缝拼合，
      并指出残页边缘蹭掉的蓝黑碳素墨水与周叙袖口及无名指旧痕的对应关系，迫使周叙承认三年前事故当夜是他亲手撕下第19页原件塞入林昼怀表以防被统一销毁。
    plant_keywords:
      - "蓝黑"
      - "袖口"
    payoff_keywords:
      - "第19页"
      - "十九页"
      - "锯齿"
      - "蓝黑"

  - id: "FS-03"
    title: "北站寄存处零四九号铝牌铜钥匙"
    plant_chapter: 2
    due_chapter: 5
    plant_instruction: >
      第2章陈敬山拉开修表台最底层抽屉取煤油洗油碟时，林晚瞥见抽屉深处铁盒旁躺着一枚挂有‘049’字样椭圆铝牌的扁平铜钥匙，
      陈敬山迅速推上抽屉未作解释。
    payoff_instruction: >
      第5章拆迁封街清晨，陈敬山将装入黄杨木镊盒底格的‘北站寄存 049’铝牌铜钥匙交给林晚；
      林晚前往北站老行李房打开零四九号铁皮柜，取出林昼生前寄存的过磅原始复写底单与微型录音磁带，完成证据链闭环。
    plant_keywords:
      - "049"
      - "铝牌"
    payoff_keywords:
      - "049"
      - "寄存"
      - "铝牌"
      - "过磅"
